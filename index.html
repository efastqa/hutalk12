    <script>
      // Suppress benign [vite] HMR websocket notices & idle Firestore stream cancellations in sandbox environment
      (function() {
        function isBenignNotice(item) {
          if (!item) return false;
          var str = '';
          try {
            if (typeof item === 'string') str = item;
            else if (item.message) str = item.message;
            else if (item.stack) str = item.stack;
            else str = String(item);
          } catch(_) { return false; }
          return (
            str.indexOf('[vite]') !== -1 ||
            str.indexOf('websocket') !== -1 ||
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('ws://') !== -1 ||
            str.indexOf('wss://') !== -1 ||
            str.indexOf('Disconnecting idle stream') !== -1 ||
            str.indexOf('Timed out waiting for new targets') !== -1 ||
            str.indexOf('GrpcConnection') !== -1 ||
            str.indexOf('RpcException') !== -1 ||
            (str.indexOf('@firebase/firestore') !== -1 && (str.indexOf('CANCELLED') !== -1 || str.indexOf('idle stream') !== -1))
          );
        }

        ['error', 'warn', 'log', 'info', 'debug'].forEach(function(fn) {
          var orig = console[fn];
          console[fn] = function() {
            for (var i = 0; i < arguments.length; i++) {
              if (isBenignNotice(arguments[i])) {
                return;
              }
            }
            if (orig) orig.apply(console, arguments);
          };
        });

        window.addEventListener('error', function(e) {
          if (isBenignNotice(e.message) || isBenignNotice(e.error) || (e.filename && e.filename.indexOf('vite') !== -1)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (isBenignNotice(e.reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>

    <script>
      (function() {
        try {
          var stored = localStorage.getItem('huta_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (stored === 'dark' || (stored === 'system' && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch(e) {}
      })();
