<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover" />
    <script>
      // Suppress benign [vite] HMR websocket notices in sandbox environment
      (function() {
        function isViteHmr(item) {
          if (!item) return false;
          var str = '';
          try {
            if (typeof item === 'string') str = item;
            else if (item.message) str = item.message;
            else if (item.stack) str = item.stack;
            else str = String(item);
          } catch(_) { return false; }
          return (
            str.indexOf('[vite]') !== -1 ||
            str.indexOf('websocket') !== -1 ||
            str.indexOf('WebSocket') !== -1 ||
            str.indexOf('ws://') !== -1 ||
            str.indexOf('wss://') !== -1 ||
            str.indexOf('vite:ws') !== -1
          );
        }

        ['error', 'warn', 'log', 'info', 'debug'].forEach(function(fn) {
          var orig = console[fn];
          console[fn] = function() {
            for (var i = 0; i < arguments.length; i++) {
              if (isViteHmr(arguments[i])) {
                return;
              }
            }
            if (orig) orig.apply(console, arguments);
          };
        });

        window.addEventListener('error', function(e) {
          if (isViteHmr(e.message) || isViteHmr(e.error) || (e.filename && e.filename.indexOf('vite') !== -1)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (isViteHmr(e.reason)) {
            e.stopImmediatePropagation();
            e.preventDefault();
            return true;
          }
        }, true);
      })();
    </script>
    <title>HUTA Marketplace</title>
    <meta name="description" content="Sri Lanka's premier buy & sell classifieds marketplace for vehicles, electronics, property, and more with admin controls and member dashboards." />
